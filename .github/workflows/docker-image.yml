name: CI - Build and Test

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'test/**'
      - 'fix/**'
      - 'ci/**'

  pull_request:
    branches:
      - main
      - 'feat/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  backend:
    name: Backend - Test and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run backend tests
        run: ./mvnw --batch-mode --no-transfer-progress clean test

      - name: Build backend JAR
        run: ./mvnw --batch-mode --no-transfer-progress package -DskipTests

      - name: Generate JaCoCo report
        if: always()
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests jacoco:report

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: backend-test-reports-${{ github.sha }}
          path: backend/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: backend-jacoco-${{ github.sha }}
          path: |
            backend/target/site/jacoco/
            backend/target/jacoco.exec
          if-no-files-found: warn
          retention-days: 14

      - name: Upload backend artifact
        uses: actions/upload-artifact@v5
        with:
          name: eventhub-backend-${{ github.sha }}
          path: backend/target/*.jar
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend - Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v5
        with:
          name: eventhub-frontend-${{ github.sha }}
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7
    
    integration:
    name: Backend - Integration
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run integration tests
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: backend-integration-reports-${{ github.sha }}
          path: backend/target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 14