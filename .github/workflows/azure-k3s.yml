name: Azure K3s release

on:
  push:
    branches: [main, feat/azure-k3s-deployment]
    paths:
      - backend/**
      - frontend/**
      - infra/azure/**
      - infra/minikube/docker/**
      - .github/workflows/azure-k3s.yml
  workflow_dispatch:
    inputs:
      release:
        description: Full SHA of a previously published release from main
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish frontend and backend images
        shell: bash
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          for service in backend frontend; do
            if [[ "$service" == backend ]]; then
              file=backend/Dockerfile
              context=backend
            else
              file=infra/minikube/docker/frontend.Dockerfile
              context=.
            fi
            docker buildx build --platform linux/amd64 --file "$file" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --tag "$prefix-$service:$GITHUB_SHA" --push "$context"
          done

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: azure-demo
    concurrency:
      group: eventhub-azure
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE: ${{ inputs.release }}
      EVENTHUB_HOST: ${{ vars.EVENTHUB_HOST }}
      EVENTHUB_ACME_EMAIL: ${{ vars.EVENTHUB_ACME_EMAIL }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_VM_NAME: ${{ vars.AZURE_VM_NAME }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate release from main
        run: |
          [[ "$RELEASE" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$RELEASE" origin/main
          git checkout --detach "$RELEASE"
          for service in frontend backend; do
            docker manifest inspect "ghcr.io/${GITHUB_REPOSITORY,,}-$service:$RELEASE" > /dev/null
          done
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy to the VM using Azure Run Command
        shell: bash
        run: |
          [[ "$EVENTHUB_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$EVENTHUB_ACME_EMAIL" =~ ^[a-zA-Z0-9._%+@-]+$ ]]
          archive=$(tar -czf - -C infra azure | base64 -w 0)
          {
            printf '#!/bin/bash\nset -euo pipefail\n'
            printf 'work=$(mktemp -d)\ntrap '\''rm -rf "$work"'\'' EXIT\n'
            printf 'printf %%s %q | base64 -d | tar -xzf - -C "$work"\n' "$archive"
            printf 'bash "$work/azure/deploy.sh" %q %q %q %q\n' \
              "ghcr.io/${GITHUB_REPOSITORY,,}" "$RELEASE" "$EVENTHUB_HOST" "$EVENTHUB_ACME_EMAIL"
          } > deploy-vm.sh
          result=$(az vm run-command invoke --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_VM_NAME" --command-id RunShellScript --scripts @deploy-vm.sh)
          jq -r '.value[].message' <<< "$result" | tee deploy-output.txt
          grep -Fx 'EVENTHUB_DEPLOY_OK' deploy-output.txt
      - name: Verify public HTTPS
        run: |
          curl -fsS --retry 8 --retry-all-errors --retry-delay 10 --max-time 20 "https://$EVENTHUB_HOST/" -o /dev/null
          curl -fsS --max-time 20 "https://$EVENTHUB_HOST/api/events?size=1" | jq -e '.totalElements > 0'
