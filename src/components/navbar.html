<!-- 🟢 AUTH MODAL (Popup กล่องสี่เหลี่ยม สำหรับ Login/Register) -->
<!-- ======================================================= -->
<div id="auth-modal-overlay" class="auth-modal-overlay" style="display: none;">
  
  <!-- 1. กล่อง Login -->
  <div id="modal-login" class="auth-modal-box" style="display: none;">
    <button class="btn-close-modal" onclick="closeModal()">✕</button>
    <div class="login-icon"><img src="https://via.placeholder.com/48/93C5FD/FFFFFF?text=+" alt="Icon"></div>
    <div class="login-subtitle">สำหรับสมาชิก</div>
    <h1 class="login-title">เข้าสู่ระบบเพื่อลงทะเบียน</h1>
    
    <form onsubmit="handleLoginSubmit(event)">
      <div class="form-group"><label>อีเมล</label><input type="email" required></div>
      <div class="form-group"><label>รหัสผ่าน</label><input type="password" required></div>
      <button type="submit" class="btn-submit-login">เข้าสู่ระบบ</button>
    </form>
    
    <div class="login-footer">
      ยังไม่มีบัญชี Petopia? <a href="#" onclick="switchModal(event, 'register')">สร้างบัญชีใหม่</a>
    </div>
  </div>

  <!-- 2. กล่อง Register -->
  <div id="modal-register" class="auth-modal-box" style="display: none;">
    <button class="btn-close-modal" onclick="closeModal()">✕</button>
    <div class="login-icon"><img src="https://via.placeholder.com/48/D1FAE5/10B981?text=+" alt="Icon"></div>
    <div class="login-subtitle" style="color: #10B981;">สมัครสมาชิก</div>
    <h1 class="login-title">สร้างบัญชีของคุณ</h1>
    
    <form onsubmit="handleRegisterSubmit(event)">
      <div class="form-group"><label>ชื่อที่แสดง</label><input type="text" required></div>
      <div class="form-group"><label>อีเมล</label><input type="email" required></div>
      <div class="form-group"><label>รหัสผ่าน</label><input type="password" required minlength="8"></div>
      <button type="submit" class="btn-submit-register">สร้างบัญชีและเริ่มจอง</button>
    </form>
    
    <div class="login-footer">
      มีบัญชีอยู่แล้ว? <a href="#" onclick="switchModal(event, 'login')">เข้าสู่ระบบ</a>
    </div>
  </div>

</div>
