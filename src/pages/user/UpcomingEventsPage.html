<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upcoming Events - PETOPIA</title>
  <link rel="stylesheet" href="../../css/styles.css">
</head>
<body>

  <div id="navbar-placeholder"></div>

  <main class="container">

    <section class="hero-section">
      <div class="hero-text">
        <p class="hero-subtitle">เหตุผลดี ๆ ที่จะได้มาเจอกัน</p>
        <h1 class="hero-title">ไอเดียที่ดี<br>เริ่มต้นเมื่อเรา<br>ออกมาเจอกัน</h1>
        <p class="hero-desc">ค้นหาเวิร์กช็อป ทอล์ก และกิจกรรมชุมชนที่คัดสรรมาเพื่อคนช่างสงสัย</p>
        <button class="btn-all-events">ดูอีเวนต์ทั้งหมด →</button>
      </div>
      
      <div class="hero-card" id="hero-card-container">
      </div>
    </section>

    <section class="category-section">
      <p class="category-subtitle">เลือกตามความสนใจ</p>
      <h2 class="category-title">เลือกตามความสนใจ</h2>
      <div class="filter-pills">
        <button class="pill active">ทุกความสนใจ</button>
        <button class="pill">เทคโนโลยี</button>
        <button class="pill">ออกแบบ</button>
        <button class="pill">อาชีพ</button>
        <button class="pill">คอมมูนิตี้</button>
      </div>
    </section>

    <div class="gather-picks-banner">
      <div class="gather-left">
        <span class="gather-badge">GATHER PICKS</span>
        <h3 class="gather-title">อีเวนต์น่าสนใจประจำสัปดาห์</h3>
      </div>
      <span style="font-size: 20px; font-weight: bold; cursor: pointer;">→</span>
    </div>

    <section class="events-grid" id="events-grid-container">
    </section>

  </main>

  <script src="../../js/app.js"></script>
</body>
</html>
