apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: eventhub-data
spec:
  storageClassName: local-path
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventhub-backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: eventhub-backend
  template:
    metadata:
      labels:
        app: eventhub-backend
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
      containers:
        - name: backend
          image: eventhub-backend
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9091
              name: metrics
          envFrom:
            - secretRef:
                name: eventhub-runtime
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:h2:file:/data/db/eventhub
            - name: APP_UPLOAD_DIR
              value: /data/uploads
            - name: SPRING_PROFILES_ACTIVE
              value: prod,cloud-demo,metrics,tracing
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=55
            - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
              value: http://tempo:4318/v1/traces
          volumeMounts:
            - name: data
              mountPath: /data
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: metrics
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: metrics
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: metrics
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1200Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: eventhub-data
---
apiVersion: v1
kind: Service
metadata:
  name: eventhub-backend
spec:
  selector:
    app: eventhub-backend
  ports:
    - name: http
      port: 8080
    - name: metrics
      port: 9091
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventhub-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eventhub-frontend
  template:
    metadata:
      labels:
        app: eventhub-frontend
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: eventhub-frontend
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: eventhub-frontend
spec:
  selector:
    app: eventhub-frontend
  ports:
    - name: http
      port: 80
