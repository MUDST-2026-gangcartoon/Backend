apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eventhub-ingress
  namespace: eventhub-e2e
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - eventhub.local
      secretName: eventhub-local-tls
  rules:
    - host: eventhub.local
      http:
        paths:
          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: eventhub-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eventhub-frontend
                port:
                  number: 80
