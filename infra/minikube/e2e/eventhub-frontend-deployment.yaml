apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventhub-frontend
  namespace: eventhub-e2e
  labels:
    app: eventhub-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eventhub-frontend
  template:
    metadata:
      labels:
        app: eventhub-frontend
    spec:
      containers:
        - name: frontend
          image: eventhub-frontend:e2e
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
