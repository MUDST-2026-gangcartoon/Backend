apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventhub-backend
  namespace: eventhub-e2e
  labels:
    app: eventhub-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eventhub-backend
  template:
    metadata:
      labels:
        app: eventhub-backend
    spec:
      containers:
        - name: backend
          image: eventhub-backend:e2e
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: eventhub-backend-config
          env:
            - name: APP_E2E_SEED_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eventhub-backend-secret
                  key: APP_E2E_SEED_PASSWORD
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
