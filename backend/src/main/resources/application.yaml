spring:
  application:
    name: eventhub
  mail:
    properties:
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
      "[mail.smtp.auth]": ${APP_GUEST_SMTP_AUTH:true}
      "[mail.smtp.starttls.enable]": ${APP_GUEST_SMTP_STARTTLS_ENABLE:true}
      "[mail.smtp.starttls.required]": ${APP_GUEST_SMTP_STARTTLS_REQUIRED:true}
app:
  guest-verification:
    from: ${APP_GUEST_VERIFICATION_FROM:}
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        name: EVENTHUB_SESSION
        http-only: true
        same-site: lax
# Health endpoints for Infrastructure probes
management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: never
      probes:
        enabled: true