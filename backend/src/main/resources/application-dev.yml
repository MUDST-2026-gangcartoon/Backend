
spring:
  datasource:
    url: jdbc:h2:file:./data/eventhub;AUTO_SERVER=TRUE
    username: sa
    password:

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  h2:
    console:
      enabled: true

server:
  servlet:
    session:
      cookie:
        secure: false
